<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0706" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>%GAME_NAME%</title>
    <meta name="description" content="Dawood's pen-and-paper flick war, fought on the back page of a maths copy under a desk lamp. Draw your camps, flick your pen, cross them out." />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="%GAME_SHORT%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dotfight.vercel.app/" />
    <meta property="og:title" content="%GAME_NAME%" />
    <meta property="og:description" content="Dawood's pen-and-paper flick war, fought on the back page of a maths copy under a desk lamp." />
    <meta property="og:image" content="https://dotfight.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dotfight.vercel.app/og.jpg" />
  </head>
  <body>
    <div id="world" aria-hidden="true">
      <canvas id="desk"></canvas>
      <div id="page-host"></div>
      <div id="boil-host"></div>
      <canvas id="live"></canvas>
      <canvas id="light"></canvas>
      <canvas id="haze"></canvas>
    </div>
    <canvas id="over" aria-label="The page. Touch one of your soldiers, pull back, let go."></canvas>

    <header id="top">
      <button id="menu-btn" class="tab" aria-label="Menu"><span>≡</span></button>
      <div class="tag" data-p="0"><span class="name">Blue</span><span class="count"></span></div>
      <div class="tag" data-p="1"><span class="name">Red</span><span class="count"></span></div>
      <button id="page-btn" class="tab" aria-label="Stand up and see the whole page"><span>page</span></button>
    </header>

    <footer id="bottom">
      <p id="status" aria-live="polite"></p>
      <div id="kind" role="radiogroup" aria-label="What the soldier does">
        <button data-kind="move" role="radio"><b>move</b><i>he goes where the ink stops</i></button>
        <button data-kind="shoot" role="radio"><b>shoot</b><i>the ink runs off the page</i></button>
      </div>
    </footer>

    <section id="cover" hidden>
      <div class="book">
        <div class="label">
          <p class="school">EXERCISE BOOK · SQUARED</p>
          <h1>%GAME_NAME_HTML%</h1>
          <p class="field"><span>Name</span><b class="hand blue">Dawood</b></p>
          <p class="field"><span>Subject</span><b class="hand blue">War</b></p>
          <p class="field"><span>Class</span><b class="hand blue">after lights out</b></p>
        </div>
        <nav class="menu"></nav>
      </div>
    </section>

    <div id="sheet" hidden><div class="card"></div></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

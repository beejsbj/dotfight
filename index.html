<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2825" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Pen Flick Tactics</title>
    <meta name="description" content="Dawood's pen-and-paper flick war, on a notebook page. Draw your bases, flick your pen, cross them out." />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pen Flick" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pen-flick-tactics.vercel.app/" />
    <meta property="og:title" content="Pen Flick Tactics" />
    <meta property="og:description" content="Dawood's pen-and-paper flick war, on a notebook page. Draw your bases, flick your pen, cross them out." />
    <meta property="og:image" content="https://pen-flick-tactics.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://pen-flick-tactics.vercel.app/og.jpg" />
  </head>
  <body>
    <canvas id="page"></canvas>

    <header id="top">
      <div class="slip side" data-p="0"><span class="name">Blue</span><svg class="tally"></svg></div>
      <button id="menu-btn" class="slip" aria-label="Menu">≡</button>
      <div class="slip side" data-p="1"><span class="name">Red</span><svg class="tally"></svg></div>
    </header>

    <footer id="bottom">
      <div id="chips" class="slip" hidden></div>
      <p id="status"></p>
      <div class="slip strip">
        <button id="fit-btn" aria-label="See whole page">page</button>
        <div id="kind">
          <button data-kind="move">move</button>
          <button data-kind="shoot">shoot</button>
        </div>
        <span id="turn-no"></span>
      </div>
    </footer>

    <div id="sheet" hidden><div class="card"></div></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
